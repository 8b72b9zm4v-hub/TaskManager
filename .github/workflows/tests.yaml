name: Node.js CI
run-name: Run Tests

on:
  push:
    branches:
      - dev
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./backend
    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "20.x"
    - run: npm install
    - run: npm run build --if-present
    - run: npm run test
