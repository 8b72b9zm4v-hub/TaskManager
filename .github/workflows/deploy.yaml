name: Deploy App
run-name: Deploy App

on:
    push:
        branches:
          - main
        # paths:
        #     - "backend/**"
        #     - "terraform/prod/**"
        #     - ".github/workflows/deploy.yaml"        
permissions:
  contents: read
  id-token: write
jobs:
    # TODO créer l'image docker et la push sur l'ACR
    buildandpushimage:
        runs-on: ubuntu-latest
        steps:
            - name: Login to azure
              uses: azure/login@v3
              with:
                client-id: ${{secrets.AZURE_CLIENT_ID}}
                tenant-id: ${{secrets.AZURE_TENANT_ID}}
                subscription-id: ${{secrets.AZURE_SUBSCRIPTION_ID}}
            - name: Get ACR name
              id: acr-name
              run: |
               ACR_NAME=$(az acr list --resource-group TaskManager --query '[0].name' --output tsv)
               echo "name=$ACR_NAME" >> "$GITHUB_OUTPUT"

            - name: GET ACR access token
              id: acr-token
              run: |
                ACR_TOKEN=$(az acr login --name ${{steps.acr-name.outputs.name}} --expose-token --output tsv --query accessToken)
                echo "::add-mask::$ACR_TOKEN"
                echo "token=$ACR_TOKEN" >> "$GITHUB_OUTPUT"
            - name: Login to ACR
              uses: docker/login-action@v4
              with:
                    registry: ${{steps.acr-name.outputs.name}}.azurecr.io
                    username: 00000000-0000-0000-0000-000000000000
                    password: ${{ steps.acr-token.outputs.token }}
            - uses: actions/checkout@v6
            - uses: docker/setup-buildx-action@v3
            - name: build docker
              uses: docker/build-push-action@v7
              with:
                context: ./backend
                push: true
                tags: ${{ steps.acr-name.outputs.name }}.azurecr.io/backend:${{ github.sha }}
            - name: Deploy backend revision
              run: |
                az containerapp update \
                    --name backend \
                    --resource-group TaskManager \
                    --image "${{ steps.acr-name.outputs.name }}.azurecr.io/backend:${{ github.sha }}"

    # TODO créer le schéma de la BDD et la push
    # TODO build le front et le push