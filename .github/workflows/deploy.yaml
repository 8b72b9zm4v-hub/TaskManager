name: Deploy App
run-name: Deploy App

on:
  workflow_run:
    workflows: ["Terraform Apply"]
    types: [completed]
    branches:
      - main
        # paths:
        #     - "backend/**"
        #     - "terraform/prod/**"
        #     - ".github/workflows/deploy.yaml"        
permissions:
  contents: read
  id-token: write
jobs:
    # TODO créer l'image docker et la push sur l'ACR
    buildandpushimage:
      if: ${{ github.event.workflow_run.conclusion == 'success' }}
      runs-on: ubuntu-latest
      steps:
          - name: Login to azure
            uses: azure/login@v3
            with:
              client-id: ${{secrets.AZURE_CLIENT_ID}}
              tenant-id: ${{secrets.AZURE_TENANT_ID}}
              subscription-id: ${{secrets.AZURE_SUBSCRIPTION_ID}}
          - name: Get ACR name
            id: acr-name
            run: |
              ACR_NAME=$(az acr list --resource-group TaskManager --query '[0].name' --output tsv)
              echo "name=$ACR_NAME" >> "$GITHUB_OUTPUT"

          - name: GET ACR access token
            id: acr-token
            run: |
              ACR_TOKEN=$(az acr login --name ${{steps.acr-name.outputs.name}} --expose-token --output tsv --query accessToken)
              echo "::add-mask::$ACR_TOKEN"
              echo "token=$ACR_TOKEN" >> "$GITHUB_OUTPUT"
          - name: Login to ACR
            uses: docker/login-action@v4
            with:
                  registry: ${{steps.acr-name.outputs.name}}.azurecr.io
                  username: 00000000-0000-0000-0000-000000000000
                  password: ${{ steps.acr-token.outputs.token }}
          - uses: actions/checkout@v6
            with:
              ref: ${{ github.event.workflow_run.head_sha }}
          - uses: docker/setup-buildx-action@v3
          - name: build docker
            uses: docker/build-push-action@v7
            with:
              context: ./backend
              push: true
              tags: ${{ steps.acr-name.outputs.name }}.azurecr.io/backend:${{ github.event.workflow_run.head_sha }}
          - name: Update job revision
            run: |
              az containerapp job update \
                  --name database-migration \
                  --resource-group TaskManager \
                  --image "${{ steps.acr-name.outputs.name }}.azurecr.io/backend:${{ github.event.workflow_run.head_sha }}"
          - name: Run migration job
            run: |
              EXECUTION_NAME=$(az containerapp job start \
              --name database-migration \
              --resource-group TaskManager \
              --query name \
              --output tsv)
              for attempt in {1..30}; do
                STATUS=$(az containerapp job execution show \
                  --name database-migration \
                  --resource-group TaskManager \
                  --job-execution-name "$EXECUTION_NAME" \
                  --query properties.status \
                  --output tsv)

                if [ "$STATUS" = "Succeeded" ]; then
                  exit 0
                fi

                if [ "$STATUS" = "Failed" ]; then
                  echo "La migration a échoué."
                  exit 1
                fi

                sleep 5
              done

              echo "Délai d'attente dépassé."
              exit 1
          - name: Deploy backend revision
            run: |
              az containerapp update \
                  --name backend \
                  --resource-group TaskManager \
                  --image "${{ steps.acr-name.outputs.name }}.azurecr.io/backend:${{ github.event.workflow_run.head_sha }}"

    # TODO créer le schéma de la BDD et la push
    # TODO build le front et le push