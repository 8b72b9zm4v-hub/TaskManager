name: Node.js CI
run-name: Run Tests

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
      - dev
jobs:

  testsbackend:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./backend
    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "20.x"
    - run: npm install
    - run: npm run build
    - run: npm run test

  buildfrontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
      - run: npm install
      - run: npm run build
  builddocker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Use Docker
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false

  callpr:
    needs: [testsbackend,builddocker,buildfrontend]
    uses: ./.github/workflows/pr-on-main.yaml
    secrets:
      PR_AUTOMATION_APP_PRIVATE_KEY: ${{secrets.PR_AUTOMATION_APP_PRIVATE_KEY}}


